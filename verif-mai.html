<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérification & nettoyage MAI</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:#eef1f6;color:#1b2430;padding:24px;}
.wrap{max-width:1000px;margin:0 auto;}
.card{background:#fff;border:1px solid #e3e8ef;border-radius:14px;padding:22px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.card-danger{border:2px solid #e0b3ad;background:#fffaf9;}
h1{font-size:19px;color:#1F3864;margin-bottom:6px;}
h2{font-size:15px;color:#1F3864;margin:4px 0 8px;}
h2.dg{color:#b3362b;}
.sub{font-size:13px;color:#5a6572;line-height:1.5;margin-bottom:8px;}
input{padding:10px 12px;border:1px solid #e3e8ef;border-radius:9px;font-size:14px;}
input#pass{width:220px;}
.btn{border:none;border-radius:9px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px;margin-right:8px;}
.btn-scan{background:#1F3864;color:#fff;} .btn-scan:hover{background:#28477d;}
.btn-danger{background:#c0392b;color:#fff;} .btn-danger:hover{background:#d94435;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
th,td{border:1px solid #e3e8ef;padding:5px 7px;text-align:left;}
th{background:#f4f6fa;position:sticky;top:0;}
.scrollbox{max-height:340px;overflow:auto;border:1px solid #eee;border-radius:8px;margin-top:8px;}
.bad{background:#fde8e8;} .warn{background:#fff7e6;}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;}
.tag-bad{background:#dc3545;color:#fff;} .tag-warn{background:#c9971d;color:#fff;}
#log{font-family:monospace;font-size:12px;background:#0f1e3d;color:#cbd5e1;border-radius:9px;padding:12px;margin-top:12px;white-space:pre-wrap;min-height:36px;}
.err{color:#ff9a9a;} .grn{color:#7CF5B0;} .muted{color:#8ea0bf;}
.count{display:inline-block;background:#1F3864;color:#fff;border-radius:20px;padding:3px 12px;font-weight:700;font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Vérification & nettoyage des vols Mauritania Airlines</h1>
    <p class="sub">Connecte-toi, puis lance l'analyse (lecture seule). La suppression définitive
      est une action séparée, en bas, avec double confirmation.</p>
    <input id="pass" type="password" placeholder="Mot de passe DADY">
    <br><button class="btn btn-scan" id="btnScan">Analyser (lecture seule)</button>
    <div id="log">Prêt.</div>
  </div>
  <div id="results"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence }
  from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { getFirestore, collection, getDocs, doc, deleteDoc }
  from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const cfg = {
  apiKey: "AIzaSyCHzrNNRL1MrBCCqxc-1wso9gcBwBztO40",
  authDomain: "anacmr-67835.firebaseapp.com",
  projectId: "anacmr-67835",
  storageBucket: "anacmr-67835.firebasestorage.app",
  messagingSenderId: "906668222910",
  appId: "1:906668222910:web:0231614b880df3196e26cf"
};
const app = initializeApp(cfg);
const auth = getAuth(app);
const db = getFirestore(app);

let _delList = [];   // vols MAI jan-fév-mars à supprimer

function log(m,c){ const e=document.getElementById('log'); const d=document.createElement('div'); if(c)d.className=c; d.textContent=m; e.appendChild(d); e.scrollTop=e.scrollHeight; }
function clg(){ document.getElementById('log').innerHTML=''; }
function normFN(s){ let v=(s||'').toString().toUpperCase().replace(/[-\s.]/g,''); v=v.replace(/^([A-Z]+)0*(\d.*)$/,'$1$2'); return v; }
function isMAI(co){ const c=(co||'').toUpperCase(); return c.includes('MAURITANIA')||c==='MAI'||c==='L6'; }
function ym(d){ const s=String(d||''); const m=s.match(/^(\d{4})-(\d{2})/); return m?(m[1]+'-'+m[2]):''; }

async function ensureAuth(pass){
  try{ await setPersistence(auth,browserLocalPersistence);}catch(e){}
  try{ await auth.signOut(); }catch(e){}
  await signInWithEmailAndPassword(auth,'dady@sgv-anac.local',pass);
}

document.getElementById('btnScan').addEventListener('click', async function(){
  clg(); document.getElementById('results').innerHTML=''; _delList=[];
  const pass=document.getElementById('pass').value;
  if(!pass){ log('Renseigne le mot de passe DADY.','err'); return; }
  try{ log('Connexion…'); await ensureAuth(pass); log('Connecté. Lecture de la base…','grn'); }
  catch(e){ log('Connexion échouée : '+(e&&(e.code||e.message)),'err'); return; }

  // Table Numéros de Vol : type attendu par numéro
  const fnSnap=await getDocs(collection(db,'flight_numbers'));
  const fnType={};   // normFN -> Set des types connus
  fnSnap.forEach(d=>{ const x=d.data(); const n=normFN(x.number||x.flightNumber||''); const t=(x.type||'').toUpperCase(); if(n&&t){ (fnType[n]=fnType[n]||new Set()).add(t); } });

  // Tous les vols
  const flSnap=await getDocs(collection(db,'flights'));
  const flights=[];
  flSnap.forEach(d=>flights.push({id:d.id,...d.data()}));
  const mai=flights.filter(f=>isMAI(f.company));
  log('Vols totaux : '+flights.length+' · dont MAI : '+mai.length,'muted');

  // ── A1. Doublons (même n° + date + type) parmi MAI ──
  const seen={}; const dups=[];
  mai.forEach(f=>{
    const key=normFN(f.flightNumber)+'|'+(f.date||'')+'|'+((f.type||'').toUpperCase());
    if(seen[key]){ dups.push(f); seen[key].count++; } else seen[key]={count:1,first:f};
  });

  // ── A2. Type incohérent avec la table Numéros de Vol ──
  const wrong=[];
  mai.forEach(f=>{
    const n=normFN(f.flightNumber); const t=(f.type||'').toUpperCase();
    if(fnType[n] && t && !fnType[n].has(t)){
      wrong.push({...f, attendu:[...fnType[n]].join('/')});
    }
  });

  // ── B. Vols MAI jan-fév-mars 2026 (à supprimer) ──
  const targetMonths=new Set(['2026-01','2026-02','2026-03']);
  _delList = mai.filter(f=>targetMonths.has(ym(f.date)));

  // Rendu
  let html='';

  // A1
  html+='<div class="card"><h2>Doublons MAI (même numéro + date + type)</h2>';
  html+='<p class="sub"><span class="count">'+dups.length+'</span> doublon(s) — à corriger manuellement dans l\'accueil.</p>';
  if(dups.length){
    html+='<div class="scrollbox"><table><tr><th>Date</th><th>N° Vol</th><th>Type</th><th>De</th><th>À</th><th>PAX</th><th>N° Auth</th></tr>';
    dups.sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.flightNumber).localeCompare(String(b.flightNumber)));
    dups.forEach(f=>{ html+='<tr class="bad"><td>'+(f.date||'')+'</td><td>'+(f.flightNumber||'')+'</td><td>'+((f.type||'').toUpperCase())+'</td><td>'+((f.from||'').toUpperCase())+'</td><td>'+((f.to||'').toUpperCase())+'</td><td>'+(f.passengers||f.pax||0)+'</td><td>'+(f.authorizationNumber||'')+'</td></tr>'; });
    html+='</table></div>';
  }
  html+='</div>';

  // A2
  html+='<div class="card"><h2>Type DEP/ARR incohérent avec la table Numéros de Vol</h2>';
  html+='<p class="sub"><span class="count">'+wrong.length+'</span> vol(s) où le type enregistré ≠ type attendu pour ce numéro.</p>';
  if(wrong.length){
    html+='<div class="scrollbox"><table><tr><th>Date</th><th>N° Vol</th><th>Type actuel</th><th>Type attendu</th><th>De</th><th>À</th><th>N° Auth</th></tr>';
    wrong.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    wrong.forEach(f=>{ html+='<tr class="warn"><td>'+(f.date||'')+'</td><td>'+(f.flightNumber||'')+'</td><td><span class="tag tag-warn">'+((f.type||'').toUpperCase())+'</span></td><td>'+f.attendu+'</td><td>'+((f.from||'').toUpperCase())+'</td><td>'+((f.to||'').toUpperCase())+'</td><td>'+(f.authorizationNumber||'')+'</td></tr>'; });
    html+='</table></div>';
  }
  html+='</div>';

  // B — suppression
  html+='<div class="card card-danger"><h2 class="dg">⚠ Suppression définitive — MAI janvier, février, mars 2026</h2>';
  html+='<p class="sub"><span class="count" style="background:#c0392b;">'+_delList.length+'</span> vol(s) MAI (charters inclus) seront <strong>définitivement supprimés</strong>. Vérifie la liste ci-dessous.</p>';
  if(_delList.length){
    const byMonth={};
    _delList.forEach(f=>{ const k=ym(f.date); byMonth[k]=(byMonth[k]||0)+1; });
    html+='<p class="sub">Répartition : '+Object.keys(byMonth).sort().map(k=>k+' → '+byMonth[k]).join(' · ')+'</p>';
    html+='<div class="scrollbox"><table><tr><th>Date</th><th>N° Vol</th><th>Type</th><th>De</th><th>À</th><th>PAX</th><th>Charter</th></tr>';
    _delList.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    _delList.forEach(f=>{ html+='<tr><td>'+(f.date||'')+'</td><td>'+(f.flightNumber||'')+'</td><td>'+((f.type||'').toUpperCase())+'</td><td>'+((f.from||'').toUpperCase())+'</td><td>'+((f.to||'').toUpperCase())+'</td><td>'+(f.passengers||f.pax||0)+'</td><td>'+(f.isCharter?'✓':'')+'</td></tr>'; });
    html+='</table></div>';
    html+='<p class="sub" style="margin-top:14px;"><strong>Pour confirmer</strong>, tape exactement <code>SUPPRIMER MAI</code> ci-dessous :</p>';
    html+='<input id="confirmTxt" type="text" placeholder="SUPPRIMER MAI" style="width:220px;">';
    html+='<br><button class="btn btn-danger" id="btnDelete">Supprimer définitivement ('+_delList.length+')</button>';
  } else {
    html+='<p class="sub grn">Aucun vol MAI trouvé pour janvier-février-mars 2026.</p>';
  }
  html+='</div>';

  document.getElementById('results').innerHTML=html;
  log('Analyse terminée. Vérifie les tableaux.','grn');

  const bd=document.getElementById('btnDelete');
  if(bd) bd.addEventListener('click', doDelete);
});

async function doDelete(){
  const conf=(document.getElementById('confirmTxt').value||'').trim();
  if(conf!=='SUPPRIMER MAI'){ log('Confirmation incorrecte. Tape exactement : SUPPRIMER MAI','err'); return; }
  if(!confirm('Dernière confirmation : supprimer définitivement '+_delList.length+' vol(s) MAI (jan-fév-mars 2026) ? Cette action est IRRÉVERSIBLE.')) return;
  const btn=document.getElementById('btnDelete'); btn.disabled=true;
  const pass=document.getElementById('pass').value;
  try{ await ensureAuth(pass); }catch(e){ log('Reconnexion échouée : '+(e&&e.code),'err'); btn.disabled=false; return; }
  let ok=0,err=0;
  for(const f of _delList){
    try{ await deleteDoc(doc(db,'flights',f.id)); ok++; if(ok%20===0) log('… '+ok+' supprimés','muted'); }
    catch(e){ err++; log('Échec '+f.id+' : '+(e&&e.code),'err'); }
  }
  log('TERMINÉ : '+ok+' vol(s) supprimé(s), '+err+' erreur(s).', err?'err':'grn');
  if(!err) log('→ Recharge le site (Ctrl+Shift+R) pour voir le résultat.','grn');
  btn.disabled=true; btn.textContent='Supprimé';
}
</script>
</body>
</html>
