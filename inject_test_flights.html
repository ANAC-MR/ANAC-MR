<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ANAC — Vols Test</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Segoe UI',sans-serif; background:#0f172a; color:#e2e8f0; padding:30px 20px; }
h1 { font-size:20px; font-weight:800; margin-bottom:4px; }
.sub { font-size:12px; color:#64748b; margin-bottom:24px; }
.card { background:#1e293b; border:1px solid #334155; border-radius:12px; padding:22px; margin-bottom:16px; }
.card h2 { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; color:#64748b; margin-bottom:16px; }
.stats { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
.stat { background:#0f172a; border:1px solid #1e3a5f; border-radius:9px; padding:10px 16px; text-align:center; min-width:110px; }
.stat-val { font-size:22px; font-weight:800; color:#38bdf8; }
.stat-lbl { font-size:10px; color:#64748b; margin-top:2px; }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
.btn { display:inline-flex; align-items:center; gap:7px; padding:12px 22px; border:none; border-radius:9px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; transition:all .2s; }
.g { background:linear-gradient(135deg,#059669,#047857); color:#fff; box-shadow:0 3px 12px rgba(5,150,105,.3); }
.r { background:linear-gradient(135deg,#dc2626,#b91c1c); color:#fff; box-shadow:0 3px 12px rgba(220,38,38,.3); }
.btn:hover { opacity:.85; transform:translateY(-1px); }
.btn:disabled { opacity:.4; cursor:not-allowed; transform:none !important; }
.ctrl { display:flex; align-items:center; gap:8px; background:#0f172a; border:1px solid #334155; border-radius:9px; padding:8px 14px; }
.ctrl label { font-size:12px; color:#94a3b8; white-space:nowrap; }
.ctrl input[type=number] { background:#1e293b; border:1px solid #475569; border-radius:6px; color:#fff; font-size:14px; font-weight:700; width:90px; padding:5px 8px; text-align:center; }
.ctrl input[type=range] { width:140px; accent-color:#38bdf8; }
.log { background:#0f172a; border:1px solid #1e3a5f; border-radius:9px; padding:12px 14px; font-family:monospace; font-size:12px; line-height:1.8; max-height:200px; overflow-y:auto; white-space:pre-wrap; }
.ok { color:#34d399; } .err { color:#f87171; } .inf { color:#60a5fa; } .w { color:#fbbf24; }
.dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:middle; }
.on { background:#34d399; box-shadow:0 0 6px #34d399; }
.off { background:#ef4444; }
</style>
</head>
<body>

<h1>🧪 Vols Test — ANAC Mauritanie</h1>
<p class="sub">Ouvrez index.html dans un autre onglet · Chaque clic ajoute un lot · Rien n'est écrit dans Firebase</p>

<div class="card">
  <h2>📊 État</h2>
  <div class="stats">
    <div class="stat"><div class="stat-val" id="sTotal">0</div><div class="stat-lbl">Vols injectés</div></div>
    <div class="stat"><div class="stat-val" id="sDep">0</div><div class="stat-lbl">Départs</div></div>
    <div class="stat"><div class="stat-val" id="sArr">0</div><div class="stat-lbl">Arrivées</div></div>
    <div class="stat">
      <div class="stat-val" style="font-size:13px;padding-top:5px;">
        <span class="dot off" id="dot"></span><span id="siteTxt">–</span>
      </div>
      <div class="stat-lbl">Site</div>
    </div>
  </div>
</div>

<div class="card">
  <h2>⚡ Actions</h2>
  <div class="row">
    <div class="ctrl">
      <label>Vols par lot :</label>
      <input type="number" id="batchSize" value="200" min="50" max="1000" step="50">
    </div>
  </div>
  <div class="row">
    <button class="btn g" id="btnAdd" onclick="addBatch()">➕ Ajouter un lot</button>
    <button class="btn r" id="btnRem" onclick="removeAll()">🗑️ Tout retirer</button>
  </div>
  <div class="log" id="log"><span class="inf">Ouvrez index.html dans un autre onglet du même navigateur.</span>
</div>
</div>

<script>
let total=0, dep=0, arr=0;
const ch = new BroadcastChannel('anac_test_flights');

// Écouter réponses du site
ch.addEventListener('message', evt => {
  const { cmd, total:t, test:n } = evt.data || {};
  if (cmd === 'pong') {
    setConn(true);
  } else if (cmd === 'ack') {
    dep = evt.data.dep || dep;
    arr = evt.data.arr || arr;
    total = evt.data.test || total;
    updateStats();
    addLog('✓ Lot ajouté — '+t+' vols au total dans le site ('+total+' tests).', 'ok');
    setBtns(false);
  } else if (cmd === 'ack_remove') {
    total=0; dep=0; arr=0; updateStats();
    addLog('✓ Vols test retirés. Site: '+t+' vols Firebase.', 'ok');
    setBtns(false);
  }
});

function setConn(ok) {
  document.getElementById('dot').className = 'dot '+(ok?'on':'off');
  document.getElementById('siteTxt').textContent = ok ? 'Connecté' : 'Non connecté';
}
function updateStats() {
  document.getElementById('sTotal').textContent = total;
  document.getElementById('sDep').textContent   = dep;
  document.getElementById('sArr').textContent   = arr;
}
function addLog(msg, cls) {
  const el = document.getElementById('log');
  const s = document.createElement('span');
  s.className=cls||'inf'; s.textContent=msg+'\n';
  el.appendChild(s); el.scrollTop=el.scrollHeight;
}
function setBtns(dis) {
  document.getElementById('btnAdd').disabled=dis;
  document.getElementById('btnRem').disabled=dis;
}

// Ping périodique
let connected = false;
function ping() {
  connected = false;
  ch.postMessage({ cmd:'ping' });
  setTimeout(()=>{ if(!connected) setConn(false); }, 600);
}
ch.addEventListener('message', e => { if(e.data?.cmd==='pong') connected=true; });
setInterval(ping, 2000);
ping();

window.addBatch = function() {
  const n = parseInt(document.getElementById('batchSize').value)||200;
  setBtns(true);
  // Ping d'abord
  connected=false;
  ch.postMessage({ cmd:'ping' });
  setTimeout(() => {
    if (!connected) {
      addLog('Site non connecté. Ouvrez index.html dans un autre onglet.', 'err');
      setBtns(false); return;
    }
    // Envoyer juste le nombre — la génération se fait dans app.js
    addLog('Envoi commande: +'+n+' vols...', 'inf');
    ch.postMessage({ cmd:'inject_add', n });
    // Timeout si pas de réponse
    setTimeout(()=>{ if(document.getElementById('btnAdd').disabled) { addLog('Timeout — réessayez.','err'); setBtns(false); } }, 5000);
  }, 700);
};

window.removeAll = function() {
  setBtns(true);
  ch.postMessage({ cmd:'remove' });
  setTimeout(()=>setBtns(false), 2000);
};

window.addEventListener('beforeunload', ()=>{ try{ ch.postMessage({cmd:'remove'}); }catch(e){} });
</script>
</body>
</html>
