<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vols Nouakchott — ANAC Mauritanie</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#07101F;--card:#0F1B2D;--card2:#0C1828;
  --border:rgba(255,255,255,0.06);--gold:#D4AF37;
  --text:#E2EAF4;--dim:#4E6A85;--dim2:#2A4060;
  --green:#2DD4A0;--blue:#4A9EFF;
  --font:'Sora',sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 80% 50% at 50% -5%,rgba(212,175,55,0.06) 0%,transparent 55%);}

/* Header */
header{position:sticky;top:0;z-index:200;background:rgba(7,16,31,0.96);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);padding:0 32px;height:54px;
  display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.logo-icon{font-size:22px;filter:drop-shadow(0 0 6px rgba(212,175,55,.5));}
.logo-text .name{font-size:15px;font-weight:700;color:var(--text);}
.logo-text .sub{font-size:10px;color:var(--dim);margin-top:1px;}
.live{display:flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;
  background:rgba(45,212,160,.1);border:1px solid rgba(45,212,160,.2);font-size:11px;color:var(--green);}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(45,212,160,.4);}50%{opacity:.7;box-shadow:0 0 0 4px rgba(45,212,160,0);}}

/* Banner */
.wrap{max-width:1200px;margin:0 auto;padding:28px 28px 0;}
.ap-banner{background:var(--card2);border:1px solid var(--border);border-radius:16px;
  padding:18px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;overflow:hidden;position:relative;}
.ap-banner::after{content:'NKC';position:absolute;right:-4px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:100px;font-weight:700;color:rgba(255,255,255,.015);pointer-events:none;user-select:none;}
.ap-icon{width:44px;height:44px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold),#7a5f10);display:flex;align-items:center;justify-content:center;font-size:20px;}
.ap-info{flex:1;}
.ap-iata{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--gold);}
.ap-name{font-size:14px;font-weight:600;color:var(--text);margin-top:1px;}
.ap-detail{font-size:11px;color:var(--dim);margin-top:2px;}
.ap-stats{display:flex;gap:8px;}
.ast{text-align:center;padding:7px 12px;background:rgba(255,255,255,.04);border-radius:8px;border:1px solid var(--border);}
.ast-v{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--text);}
.ast-l{font-size:10px;color:var(--dim);margin-top:1px;text-transform:uppercase;letter-spacing:.05em;}

/* MAP */
.map-wrap{max-width:1200px;margin:16px auto 0;padding:0 28px;}
.map-box{border-radius:16px;overflow:hidden;border:1px solid var(--border);position:relative;}
#map{height:300px;width:100%;}
.map-hint{position:absolute;top:10px;right:10px;z-index:500;
  background:rgba(7,16,31,.85);backdrop-filter:blur(8px);
  border:1px solid var(--border);border-radius:8px;padding:5px 10px;
  font-size:11px;color:var(--dim);pointer-events:none;}
.map-info{position:absolute;bottom:10px;left:10px;z-index:500;display:none;
  background:rgba(7,16,31,.93);backdrop-filter:blur(12px);
  border:1px solid rgba(212,175,55,.3);border-radius:10px;padding:12px 16px;min-width:240px;}
.mi-vol{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--text);}
.mi-co{font-size:11px;color:var(--dim);margin-top:1px;}
.mi-route{display:flex;align-items:center;gap:8px;margin-top:8px;}
.mi-ap{text-align:center;}
.mi-city{font-size:13px;font-weight:700;color:var(--text);}
.mi-iata{font-size:10px;color:var(--dim);font-family:var(--mono);margin-top:1px;}
.mi-arrow{color:var(--gold);font-size:18px;flex:1;text-align:center;}
.mi-times{display:flex;justify-content:space-between;margin-top:7px;
  padding-top:7px;border-top:1px solid rgba(255,255,255,.05);}
.mi-t{font-family:var(--mono);font-size:14px;color:var(--gold);}

/* ── CALENDRIER SEMAINE ── */
.cal-wrap{max-width:1200px;margin:16px auto 0;padding:0 28px 60px;}

/* Navigation semaine */
.week-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.week-label{font-size:14px;font-weight:700;color:var(--text);flex:1;text-align:center;}
.week-sub{font-size:11px;color:var(--dim);display:block;font-weight:400;}
.btn-wk{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;
  padding:7px 14px;color:var(--dim);font-size:13px;font-family:var(--font);cursor:pointer;transition:all .15s;}
.btn-wk:hover{color:var(--text);border-color:rgba(255,255,255,.15);}
.btn-today{background:rgba(212,175,55,.12);border-color:var(--gold);color:var(--gold);}
.btn-today:hover{background:rgba(212,175,55,.2);}

/* Search */
.cal-search{display:flex;gap:8px;margin-bottom:12px;}
.sinput-w{flex:1;position:relative;}
.si-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:12px;pointer-events:none;}
.sinput{width:100%;background:var(--card);border:1px solid var(--border);border-radius:9px;
  padding:9px 11px 9px 30px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;}
.sinput:focus{border-color:rgba(212,175,55,.35);}
.sinput::placeholder{color:var(--dim2);}
.breset{background:transparent;border:1px solid var(--border);border-radius:9px;
  padding:9px 12px;color:var(--dim);font-size:12px;font-family:var(--font);cursor:pointer;}
.breset:hover{color:var(--text);}

/* Grille calendrier */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-day-head{text-align:center;padding:8px 4px;font-size:11px;font-weight:700;
  color:var(--dim);text-transform:uppercase;letter-spacing:.07em;}
.cal-day-head.today{color:var(--gold);}
.cal-day{background:var(--card);border:1px solid var(--border);border-radius:10px;
  min-height:120px;padding:8px 6px;transition:border-color .15s;position:relative;}
.cal-day.today{border-color:rgba(212,175,55,.35);background:rgba(212,175,55,.04);}
.cal-day.empty{background:rgba(255,255,255,.02);border-color:rgba(255,255,255,.03);}
.cal-day-num{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--dim);
  margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;}
.cal-day-num .today-badge{font-size:9px;color:var(--gold);background:rgba(212,175,55,.15);
  padding:1px 5px;border-radius:4px;font-weight:700;}
.cal-today-date{color:var(--gold);}

/* Carte vol dans calendrier */
.cal-flight{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);
  border-radius:6px;padding:5px 7px;margin-bottom:4px;cursor:pointer;
  transition:background .12s,border-color .12s;animation:fi .15s ease;}
.cal-flight:hover{background:rgba(212,175,55,.08);border-color:rgba(212,175,55,.25);}
.cal-flight.pinned{background:rgba(212,175,55,.12);border-color:rgba(212,175,55,.4);}
@keyframes fi{from{opacity:0;transform:translateY(2px);}to{opacity:1;transform:translateY(0);}}
.cf-num{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text);}
.cf-route{font-size:9px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cf-time{font-family:var(--mono);font-size:10px;color:var(--gold);margin-top:2px;}
.cf-stop{font-size:8px;color:var(--dim);background:rgba(212,175,55,.08);
  border-radius:3px;padding:1px 4px;display:inline-block;margin-top:1px;}

/* Compteur vols du jour */
.day-count{font-size:9px;color:var(--dim);background:rgba(255,255,255,.05);
  border-radius:4px;padding:1px 5px;}
.day-count.has{color:var(--gold);background:rgba(212,175,55,.1);}

/* Empty state */
.cal-empty{text-align:center;padding:20px 10px;color:var(--dim);}
.cal-empty .ico{font-size:16px;margin-bottom:4px;opacity:.4;}
.cal-empty p{font-size:10px;}
.loader-r{display:flex;align-items:center;justify-content:center;gap:8px;padding:40px;color:var(--dim);font-size:13px;}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(212,175,55,.15);border-top-color:var(--gold);animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}

/* Leaflet dark */
.leaflet-container{background:#080F1C;}
.leaflet-tile{filter:brightness(.45) saturate(.25) hue-rotate(195deg);}
.leaflet-control-attribution{display:none!important;}
.leaflet-control-zoom a{background:#101E30!important;color:#e2e8f0!important;border-color:#1e3a5f!important;}

@media(max-width:700px){
  header,.wrap,.map-wrap,.cal-wrap{padding-left:10px;padding-right:10px;}
  .wrap{padding-top:16px;}
  #map{height:220px;}
  .cal-grid{grid-template-columns:repeat(7,1fr);gap:3px;}
  .cal-day{min-height:80px;padding:5px 3px;}
  .cf-num{font-size:9px;}
  .cf-route,.cf-time,.cf-stop{display:none;}
}
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">
    <div class="logo-icon">✈️</div>
    <div class="logo-text">
      <div class="name">ANAC Mauritanie</div>
      <div class="sub">Vols Autorisés — Nouakchott</div>
    </div>
  </a>
  <div class="live"><div class="ldot"></div>En direct</div>
</header>

<div class="wrap">
  <div class="ap-banner">
    <div class="ap-icon">🛫</div>
    <div class="ap-info">
      <div class="ap-iata">NKC</div>
      <div class="ap-name">Aéroport International de Nouakchott–Oumtounsy</div>
      <div class="ap-detail">Mauritanie · GQNO · UTC+0</div>
    </div>
    <div class="ap-stats">
      <div class="ast"><div class="ast-v" id="stVols">—</div><div class="ast-l">Vols</div></div>
      <div class="ast"><div class="ast-v" id="stDest">—</div><div class="ast-l">Destinations</div></div>
      <div class="ast"><div class="ast-v" id="stComp">—</div><div class="ast-l">Compagnies</div></div>
    </div>
  </div>
</div>

<div class="map-wrap">
  <div class="map-box">
    <div id="map"></div>
    <div class="map-hint">Cliquez un vol pour voir le trajet</div>
    <div class="map-info" id="mapInfo">
      <div class="mi-vol" id="miVol">—</div>
      <div class="mi-co" id="miCo">—</div>
      <div class="mi-route">
        <div class="mi-ap"><div class="mi-city" id="miCity1">—</div><div class="mi-iata" id="miCode1">—</div></div>
        <div class="mi-arrow">→</div>
        <div class="mi-ap"><div class="mi-city" id="miCity2">—</div><div class="mi-iata" id="miCode2">—</div></div>
      </div>
      <div class="mi-times">
        <div class="mi-t" id="miT1">—</div>
        <div style="color:var(--dim);font-size:11px;">→</div>
        <div class="mi-t" id="miT2">—</div>
      </div>
    </div>
  </div>
</div>

<div class="cal-wrap">
  <!-- Navigation semaine -->
  <div class="week-nav">
    <button class="btn-wk" onclick="prevWeek()">← Semaine préc.</button>
    <div class="week-label">
      <span id="weekLabel">—</span>
      <span class="week-sub" id="weekSub"></span>
    </div>
    <button class="btn-wk btn-today" onclick="goToday()">Aujourd'hui</button>
    <button class="btn-wk" onclick="nextWeek()">Semaine suiv. →</button>
  </div>

  <!-- Recherche -->
  <div class="cal-search">
    <div class="sinput-w">
      <span class="si-ico">✈</span>
      <input class="sinput" id="sVol" type="text"
        placeholder="Filtrer par vol, ville, compagnie…"
        oninput="renderCalendar()" autocomplete="off">
    </div>
    <button class="breset" onclick="document.getElementById('sVol').value='';renderCalendar()">✕</button>
  </div>

  <!-- Jours de la semaine (entêtes) -->
  <div class="cal-grid" id="calHeads"></div>
  <!-- Cellules jours -->
  <div class="cal-grid" id="calBody">
    <div class="loader-r" style="grid-column:1/-1;"><div class="spin"></div> Chargement…</div>
  </div>
</div>

<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, collection, getDocs }
  from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const FB={apiKey:"AIzaSyCHzrNNRL1MrBCCqxc-1wso9gcBwBztO40",authDomain:"anacmr-67835.firebaseapp.com",
  projectId:"anacmr-67835",storageBucket:"anacmr-67835.firebasestorage.app",
  messagingSenderId:"906668222910",appId:"1:906668222910:web:19d92b627f155bd2dbb1ef"};
const app=getApps().find(a=>a.name==='vols')||initializeApp(FB,'vols');
const db=getFirestore(app);

// Aéroports (coordonnées pour la carte)
const AP={
  'GQNO':{city:'Nouakchott', iata:'NKC', c:[18.098,-15.948]},
  'LFPG':{city:'Paris',      iata:'CDG', c:[49.009,  2.547]},
  'LTFM':{city:'Istanbul',   iata:'IST', c:[41.262, 28.727]},
  'DAAG':{city:'Alger',      iata:'ALG', c:[36.691,  3.215]},
  'DTTA':{city:'Tunis',      iata:'TUN', c:[36.851, 10.227]},
  'GMMN':{city:'Casablanca', iata:'CMN', c:[33.368, -7.590]},
  'GOBD':{city:'Dakar',      iata:'DSS', c:[14.739,-17.490]},
  'GCLP':{city:'Las Palmas', iata:'LPA', c:[27.931,-15.388]},
  'GBYD':{city:'Banjul',     iata:'BJL', c:[13.338,-16.652]},
  'GUCY':{city:'Conakry',    iata:'CKY', c:[ 9.577,-13.612]},
  'DIAP':{city:'Abidjan',    iata:'ABJ', c:[ 5.254, -3.926]},
  'DNMM':{city:'Lagos',      iata:'LOS', c:[ 6.577,  3.321]},
  'GABS':{city:'Bamako',     iata:'BKO', c:[12.534, -7.950]},
  'GCXO':{city:'Tenerife',   iata:'TFN', c:[28.482,-16.342]},
  'GMME':{city:'Rabat',      iata:'RBA', c:[33.998, -6.752]},
};
const NKC=[18.098,-15.948];

// ── MAP ──
const map=L.map('map',{zoomControl:true,scrollWheelZoom:false,center:NKC,zoom:4});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:''}).addTo(map);
const nkcIcon=L.divIcon({className:'',iconSize:[16,16],iconAnchor:[8,8],
  html:'<div style="width:16px;height:16px;border-radius:50%;background:#D4AF37;border:3px solid #fff;box-shadow:0 0 10px rgba(212,175,55,.7);"></div>'});
L.marker(NKC,{icon:nkcIcon}).addTo(map).bindTooltip('<b>NKC</b> Nouakchott',{permanent:false,direction:'top'});
let actLine=null,actMark=null,pinnedId=null;

function showRoute(s){
  clearRoute();
  const pr=parseRouting(s.routing);
  if(!pr)return;
  // Enrichir AP depuis les données Firebase airports si dispo
  const getAP=icao=>AP[icao]||window._fbAP&&window._fbAP[icao]||null;
  const a1=getAP(pr.dep),a2=getAP(pr.arr);
  if(!a1||!a2)return;
  const arc=[];
  for(let t=0;t<=30;t++){const r=t/30;arc.push([a1.c[0]+(a2.c[0]-a1.c[0])*r+Math.sin(Math.PI*r)*4,a1.c[1]+(a2.c[1]-a1.c[1])*r]);}
  actLine=L.polyline(arc,{color:'#D4AF37',weight:2.5,opacity:.95,dashArray:'8 5'}).addTo(map);
  const dest=pr.dep==='GQNO'?pr.arr:pr.dep;
  const destAP=getAP(dest);
  if(destAP){
    const di=L.divIcon({className:'',iconSize:[12,12],iconAnchor:[6,6],
      html:'<div style="width:12px;height:12px;border-radius:50%;background:#4A9EFF;border:2px solid #fff;box-shadow:0 0 8px rgba(74,158,255,.6);"></div>'});
    actMark=L.marker(destAP.c,{icon:di}).addTo(map);
  }
  map.fitBounds(L.latLngBounds([a1.c,a2.c]).pad(.3),{animate:true,duration:.4});
  const dep=getAP(pr.dep)||{city:pr.dep,iata:pr.dep};
  const arr=getAP(pr.arr)||{city:pr.arr,iata:pr.arr};
  document.getElementById('mapInfo').style.display='';
  document.getElementById('miVol').textContent=s.vol||'—';
  document.getElementById('miCo').textContent=s.company||'';
  document.getElementById('miCity1').textContent=dep.city;
  document.getElementById('miCode1').textContent=dep.iata;
  document.getElementById('miCity2').textContent=arr.city;
  document.getElementById('miCode2').textContent=arr.iata;
  document.getElementById('miT1').textContent=pr.hdep;
  document.getElementById('miT2').textContent=pr.harr+(pr.offset?' (UTC'+pr.offset+')':'');
}
function clearRoute(){
  if(actLine){map.removeLayer(actLine);actLine=null;}
  if(actMark){map.removeLayer(actMark);actMark=null;}
  document.getElementById('mapInfo').style.display='none';
  map.setView(NKC,4,{animate:true,duration:.4});
}

// ── PARSING ROUTING ──
function parseRouting(r){
  if(!r)return null;
  const stopM=r.match(/([A-Z]{4})\s+(\d{4})\s*-\s*([A-Z]{4})\s+(\d{4})\s+(\d{4})\s*-\s*(\d{4})\s+([A-Z]{4})(\s*[+-]\d)?/);
  if(stopM){
    const[,dep,hdep,stop,hstop1,hstop2,harr,arr,offset]=stopM;
    return{dep,hdep:fmtH(hdep),arr,harr:fmtH(harr),stop,hstop1:fmtH(hstop1),hstop2:fmtH(hstop2),offset:(offset||'').trim()};
  }
  const m=r.match(/([A-Z]{4})\s+(\d{4})\s*[-]\s*(\d{4})\s+([A-Z]{4})(\s*[+-]\d)?/);
  if(!m)return null;
  return{dep:m[1],hdep:fmtH(m[2]),arr:m[4],harr:fmtH(m[3]),offset:(m[5]||'').trim(),stop:null};
}
function fmtH(h){return h?h.slice(0,2)+':'+h.slice(2):'';}

// ── JOURS OPÉRATION ──
// days: 7 chars, 'J'=actif '-'=inactif, index 0=Lun...6=Dim
function isActiveOn(days,dateStr){
  if(!days)return true;
  const d=new Date(dateStr+'T12:00:00Z');
  const jsDay=d.getUTCDay(); // 0=dim,1=lun..
  const idx=jsDay===0?6:jsDay-1; // 0=lun..6=dim
  const ch=days[idx]||'-';
  return ch!=='-'; // 'J' ou autre = actif
}
function isInPeriod(from,to,dateStr){
  if(!from&&!to)return true;
  if(from&&dateStr<from)return false;
  if(to&&dateStr>to)return false;
  return true;
}

// ── SEMAINE COURANTE ──
let weekOffset=0; // 0=semaine courante
let allSchedules=[];

function getWeekDates(){
  const today=new Date();
  const dow=today.getDay(); // 0=dim
  const lundi=new Date(today);
  lundi.setDate(today.getDate()-(dow===0?6:dow-1)+(weekOffset*7));
  return Array.from({length:7},(_,i)=>{
    const d=new Date(lundi);
    d.setDate(lundi.getDate()+i);
    return d.toISOString().split('T')[0];
  });
}

function getTodayStr(){return new Date().toISOString().split('T')[0];}

const JOURS_LONG=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const JOURS_SHORT=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const MOIS=['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];

function fmtDateLabel(ds){
  const d=new Date(ds+'T12:00:00Z');
  return d.getUTCDate()+' '+MOIS[d.getUTCMonth()];
}

window.prevWeek=function(){weekOffset--;renderCalendar();}
window.nextWeek=function(){weekOffset++;renderCalendar();}
window.goToday =function(){weekOffset=0;renderCalendar();}

function getAP2(icao){return AP[icao]||window._fbAP&&window._fbAP[icao]||{city:icao,iata:icao};}

window.renderCalendar=function(){
  const dates=getWeekDates();
  const today=getTodayStr();
  const q=(document.getElementById('sVol').value||'').trim().toUpperCase();

  // Label semaine
  const d0=new Date(dates[0]+'T12:00:00Z'),d6=new Date(dates[6]+'T12:00:00Z');
  document.getElementById('weekLabel').textContent=
    fmtDateLabel(dates[0])+' — '+fmtDateLabel(dates[6])+' '+d6.getUTCFullYear();
  document.getElementById('weekSub').textContent=
    weekOffset===0?'Semaine en cours':weekOffset>0?`+${weekOffset} semaine(s)`:`${weekOffset} semaine(s)`;

  // Entêtes
  document.getElementById('calHeads').innerHTML=dates.map((ds,i)=>{
    const isToday=ds===today;
    return `<div class="cal-day-head ${isToday?'today':''}">${JOURS_SHORT[i]}</div>`;
  }).join('');

  // Pour chaque jour, trouver les vols actifs
  const cells=dates.map(ds=>{
    const isToday=ds===today;
    let flights=allSchedules.filter(s=>
      isActiveOn(s.days,ds) && isInPeriod(s.dateFrom,s.dateTo,ds)
    );
    // Filtre texte
    if(q)flights=flights.filter(s=>
      (s.vol||'').toUpperCase().includes(q)||
      (s.company||'').toUpperCase().includes(q)||
      (s.routing||'').toUpperCase().includes(q)||
      (getAP2((parseRouting(s.routing)||{}).arr||'').city||'').toUpperCase().includes(q)||
      (getAP2((parseRouting(s.routing)||{}).dep||'').city||'').toUpperCase().includes(q)
    );
    // Trier par heure départ
    flights.sort((a,b)=>{
      const pa=parseRouting(a.routing),pb=parseRouting(b.routing);
      return (pa?pa.hdep:'').localeCompare(pb?pb.hdep:'');
    });
    return {ds,isToday,flights};
  });

  document.getElementById('calBody').innerHTML=cells.map(({ds,isToday,flights})=>{
    const d=new Date(ds+'T12:00:00Z');
    const dayNum=d.getUTCDate();
    const hasFlights=flights.length>0;
    const flightCards=flights.map((s,fi)=>{
      const pr=parseRouting(s.routing);
      const dep=getAP2(pr?pr.dep:'');
      const arr=getAP2(pr?pr.arr:'');
      const routeLabel=dep.iata+'→'+arr.iata;
      const isPinned=pinnedId===s.id+'_'+ds;
      return `<div class="cal-flight ${isPinned?'pinned':''}"
        onclick="window._calClick('${s.id}','${ds}',${fi})"
        title="${esc(s.vol||'')} · ${esc(s.company||'')} · ${routeLabel}">
        <div class="cf-num">${esc(s.vol||'—')}</div>
        <div class="cf-route">${esc(dep.city)}→${esc(arr.city)}</div>
        ${pr?`<div class="cf-time">${pr.hdep}→${pr.harr}</div>`:''}
        ${pr&&pr.stop?`<div class="cf-stop">via ${esc(getAP2(pr.stop).city)}</div>`:''}
      </div>`;
    }).join('');

    return `<div class="cal-day ${isToday?'today':''} ${!hasFlights?'empty':''}">
      <div class="cal-day-num">
        <span class="${isToday?'cal-today-date':''}">${dayNum}</span>
        ${flights.length>0?`<span class="day-count has">${flights.length}</span>`:'<span class="day-count">—</span>'}
      </div>
      ${hasFlights?flightCards:'<div class="cal-empty"><div class="ico">—</div></div>'}
    </div>`;
  }).join('');

  // Stocker pour _calClick
  window._calCells=cells;
};

window._calClick=function(schedId,ds,fi){
  const key=schedId+'_'+ds;
  if(pinnedId===key){pinnedId=null;clearRoute();}
  else{
    pinnedId=key;
    const cells=window._calCells||[];
    const cell=cells.find(c=>c.ds===ds);
    const s=cell&&cell.flights[fi];
    if(s)showRoute(s);
  }
  window.renderCalendar();
};

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── INIT ──
async function init(){
  try{
    const snap=await getDocs(collection(db,'schedules'));
    allSchedules=snap.docs.map(d=>({id:d.id,...d.data()}));

    const comp=new Set(allSchedules.map(s=>s.company).filter(Boolean)).size;
    const dests=new Set();
    allSchedules.forEach(s=>{
      const pr=parseRouting(s.routing);
      if(pr){if(pr.dep!=='GQNO')dests.add(pr.dep);if(pr.arr!=='GQNO')dests.add(pr.arr);}
    });
    document.getElementById('stVols').textContent=allSchedules.length;
    document.getElementById('stDest').textContent=dests.size;
    document.getElementById('stComp').textContent=comp;

    window.renderCalendar();
  }catch(e){
    document.getElementById('calBody').innerHTML=
      `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#fc8181;">Erreur: ${esc(e.message)}</div>`;
  }
}
init();
</script>
