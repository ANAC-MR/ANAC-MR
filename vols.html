<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vols Nouakchott — ANAC Mauritanie</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#07101F;--card:#101E30;--card2:#0F1D2D;
  --border:rgba(255,255,255,0.07);--gold:#D4AF37;
  --text:#E2EAF4;--dim:#5A7A9A;--dim2:#3A5570;
  --green:#2DD4A0;--font:'Sora',sans-serif;--mono:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth;}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 40% at 50% 0%,rgba(212,175,55,0.05) 0%,transparent 55%);}

/* Header */
header{position:sticky;top:0;z-index:200;background:rgba(7,16,31,0.95);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);padding:0 28px;height:54px;
  display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;}
.logo-plane{font-size:20px;filter:drop-shadow(0 0 5px rgba(212,175,55,0.4));}
.logo-name{font-size:14px;font-weight:700;color:var(--text);}
.logo-sub{font-size:10px;color:var(--dim);}
.live-chip{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;
  background:rgba(45,212,160,0.1);border:1px solid rgba(45,212,160,0.2);font-size:11px;color:var(--green);}
.ldot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 2s ease infinite;}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(45,212,160,.4);}50%{opacity:.7;box-shadow:0 0 0 3px rgba(45,212,160,0);}}

/* Airport banner */
.ap-hero{position:relative;z-index:5;padding:32px 28px 0;max-width:1100px;margin:0 auto;}
.ap-banner{background:var(--card2);border:1px solid var(--border);border-radius:18px;
  padding:22px 26px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  overflow:hidden;position:relative;}
.ap-banner::before{content:'NKC';position:absolute;right:-8px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:120px;font-weight:700;color:rgba(255,255,255,0.018);
  letter-spacing:-6px;pointer-events:none;user-select:none;}
.ap-icon{width:48px;height:48px;border-radius:11px;background:linear-gradient(135deg,var(--gold),#8B6914);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.ap-info{flex:1;}
.ap-code{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--gold);}
.ap-name{font-size:14px;font-weight:600;color:var(--text);margin-top:2px;}
.ap-detail{font-size:11px;color:var(--dim);margin-top:3px;}
.ap-stats{display:flex;gap:10px;flex-wrap:wrap;}
.astat{text-align:center;padding:7px 14px;background:rgba(255,255,255,0.04);border-radius:9px;border:1px solid var(--border);}
.astat-val{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--text);}
.astat-lbl{font-size:10px;color:var(--dim);margin-top:1px;text-transform:uppercase;letter-spacing:.06em;}

/* MAP */
.map-section{position:relative;z-index:5;max-width:1100px;margin:20px auto 0;padding:0 28px;}
.map-wrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--border);}
#map{height:340px;width:100%;background:#0a1628;}
.map-overlay{position:absolute;top:12px;left:12px;z-index:1000;
  background:rgba(7,16,31,0.85);backdrop-filter:blur(8px);
  border:1px solid var(--border);border-radius:10px;padding:8px 12px;
  font-size:11px;color:var(--dim);pointer-events:none;}
.map-hover-info{position:absolute;bottom:12px;left:12px;right:12px;z-index:1000;
  background:rgba(7,16,31,0.92);backdrop-filter:blur(10px);
  border:1px solid var(--border);border-radius:10px;padding:12px 16px;
  display:none;max-width:420px;}
.mhi-vol{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--text);}
.mhi-route{font-size:13px;color:var(--dim);margin-top:3px;}
.mhi-date{font-size:11px;color:var(--gold);font-family:var(--mono);margin-top:4px;}

/* Search */
.search-section{position:relative;z-index:5;max-width:1100px;margin:16px auto 0;padding:0 28px;}
.tabs{display:flex;gap:3px;background:var(--card2);border:1px solid var(--border);
  border-radius:12px 12px 0 0;padding:5px 6px 0;border-bottom:none;}
.tab{padding:8px 16px;border-radius:9px 9px 0 0;font-size:12px;font-weight:600;cursor:pointer;
  color:var(--dim);border:1px solid transparent;border-bottom:none;background:transparent;
  font-family:var(--font);transition:all .15s;}
.tab.active{background:var(--card);color:var(--text);border-color:var(--border);}
.tab:hover:not(.active){color:var(--text);}
.tab-count{margin-left:5px;padding:1px 6px;border-radius:9px;font-size:10px;font-weight:700;
  background:rgba(255,255,255,0.07);color:var(--dim);}
.tab.active .tab-count{background:rgba(212,175,55,0.15);color:var(--gold);}
.search-bar{background:var(--card);border:1px solid var(--border);border-top:none;
  border-radius:0 0 12px 12px;padding:12px 16px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;}
.sinput-wrap{flex:1;min-width:180px;position:relative;}
.si-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:12px;pointer-events:none;}
.sinput{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;
  padding:8px 11px 8px 30px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;transition:border-color .2s;}
.sinput:focus{border-color:rgba(212,175,55,0.35);}
.sinput::placeholder{color:var(--dim2);}
.dinput{background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;
  padding:8px 11px;color:var(--text);font-family:var(--mono);font-size:12px;outline:none;}
.dinput:focus{border-color:rgba(212,175,55,0.35);}
.breset{background:transparent;border:1px solid var(--border);border-radius:8px;padding:8px 13px;
  color:var(--dim);font-size:12px;font-family:var(--font);cursor:pointer;transition:all .15s;}
.breset:hover{color:var(--text);border-color:rgba(255,255,255,0.15);}

/* Table */
.flights-section{position:relative;z-index:5;max-width:1100px;margin:0 auto 60px;padding:0 28px;}
.ftable{width:100%;background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 14px 14px;overflow:hidden;}
.thead{display:grid;grid-template-columns:150px 1fr 140px 120px;
  padding:8px 18px;background:rgba(255,255,255,0.03);border-bottom:1px solid var(--border);}
.th{font-size:10px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;}
.thead-sched{display:grid;grid-template-columns:130px 150px 1fr 180px;}
.frow{display:grid;grid-template-columns:150px 1fr 140px 120px;
  padding:13px 18px;border-bottom:1px solid rgba(255,255,255,0.04);align-items:center;
  transition:background .12s;cursor:pointer;animation:rowIn .2s ease both;}
.frow:last-child{border-bottom:none;}
.frow:hover{background:rgba(212,175,55,0.04);}
.frow.active-row{background:rgba(212,175,55,0.07);border-left:3px solid var(--gold);}
@keyframes rowIn{from{opacity:0;transform:translateX(-4px);}to{opacity:1;transform:translateX(0);}}
.vol-num{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--text);}
.route{display:flex;align-items:center;gap:9px;}
.apblock{text-align:center;min-width:50px;}
.apc{font-family:var(--mono);font-size:16px;font-weight:500;color:var(--text);}
.apn{font-size:10px;color:var(--dim);margin-top:1px;white-space:nowrap;}
.rmid{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;}
.rtrack{width:100%;max-width:90px;height:1px;background:linear-gradient(90deg,var(--dim2),var(--dim),var(--dim2));position:relative;}
.rtrack::after{content:'✈';position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--gold);}
.vstop{font-size:9px;color:var(--dim);background:rgba(255,255,255,0.05);border-radius:3px;padding:1px 4px;}
.date-main{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--text);}
.date-day{font-size:10px;color:var(--dim);margin-top:1px;}
.spill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;
  font-size:11px;font-weight:600;background:rgba(45,212,160,0.1);border:1px solid rgba(45,212,160,0.2);color:var(--green);}
.sdot{width:5px;height:5px;border-radius:50%;background:currentColor;}
.state-c{padding:60px 20px;text-align:center;color:var(--dim);}
.state-c .ico{font-size:36px;margin-bottom:12px;opacity:.4;}
.state-c h3{font-size:15px;color:var(--text);margin-bottom:6px;}
.state-c p{font-size:12px;max-width:280px;margin:0 auto;line-height:1.6;}
.loader-row{display:flex;align-items:center;justify-content:center;gap:9px;padding:50px;color:var(--dim);font-size:13px;}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(212,175,55,0.15);border-top-color:var(--gold);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Leaflet dark override */
.leaflet-container{background:#0a1628;}
.leaflet-tile{filter:brightness(0.5) saturate(0.3) hue-rotate(200deg);}
.leaflet-control-attribution{display:none;}
.leaflet-control-zoom a{background:#101E30;color:#e2e8f0;border-color:#1e3a5f;}
.leaflet-popup-content-wrapper{background:#101E30;color:#e2e8f0;border:1px solid rgba(255,255,255,0.1);border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,0.5);}
.leaflet-popup-tip{background:#101E30;}
.leaflet-popup-content{font-family:'Sora',sans-serif;font-size:12px;margin:10px 14px;}

@media(max-width:680px){
  header,.ap-hero,.map-section,.search-section,.flights-section{padding-left:12px;padding-right:12px;}
  .ap-hero{padding-top:18px;}
  .ap-banner{padding:14px;}
  .thead{display:none;}
  .frow{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;gap:8px 6px;}
  .frow>:nth-child(3){grid-column:1;grid-row:2;}
  .frow>:nth-child(4){grid-column:2;grid-row:2;justify-self:end;}
  #map{height:240px;}
}
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">
    <div class="logo-plane">✈️</div>
    <div><div class="logo-name">ANAC Mauritanie</div><div class="logo-sub">Vols Autorisés — NKC</div></div>
  </a>
  <div class="live-chip"><div class="ldot"></div>Données en direct</div>
</header>

<div class="ap-hero">
  <div class="ap-banner">
    <div class="ap-icon">🛫</div>
    <div class="ap-info">
      <div class="ap-code">NKC / GQNO</div>
      <div class="ap-name">Aéroport International de Nouakchott–Oumtounsy</div>
      <div class="ap-detail">Mauritanie · UTC+0</div>
    </div>
    <div class="ap-stats">
      <div class="astat"><div class="astat-val" id="stTotal">—</div><div class="astat-lbl">Vols</div></div>
      <div class="astat"><div class="astat-val" id="stDest">—</div><div class="astat-lbl">Destinations</div></div>
      <div class="astat"><div class="astat-val" id="stComp">—</div><div class="astat-lbl">Compagnies</div></div>
    </div>
  </div>
</div>

<!-- MAP -->
<div class="map-section">
  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-overlay">Survolez un vol pour voir le trajet</div>
    <div class="map-hover-info" id="mapHover">
      <div class="mhi-vol" id="mhiVol">—</div>
      <div class="mhi-route" id="mhiRoute">—</div>
      <div class="mhi-date" id="mhiDate">—</div>
    </div>
  </div>
</div>

<div class="search-section">
  <div class="tabs">
    <button class="tab active" id="tabSched">Programme de vols <span class="tab-count" id="tcSched">0</span></button>
  </div>
  <div class="search-bar">
    <div class="sinput-wrap">
      <span class="si-icon">✈</span>
      <input class="sinput" id="sVol" type="text"
        placeholder="Vol ou destination… (ex: TK571, CDG, Istanbul)"
        oninput="doSearch()" autocomplete="off">
    </div>
    
    <button class="breset" onclick="resetSearch()">✕</button>
  </div>
</div>

<div class="flights-section">
  <div class="ftable">
    <div class="thead" style="grid-template-columns:130px 160px 1fr 180px;">
      <div class="th">Vol</div>
      <div class="th">Jours d'opération</div>
      <div class="th">Routing</div>
      <div class="th">Période</div>
    </div>
    <div id="flightsBody">
      <div class="loader-row"><div class="spinner"></div> Chargement…</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, collection, getDocs, doc, getDoc }
  from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const FB={apiKey:"AIzaSyCHzrNNRL1MrBCCqxc-1wso9gcBwBztO40",authDomain:"anacmr-67835.firebaseapp.com",
  projectId:"anacmr-67835",storageBucket:"anacmr-67835.firebasestorage.app",
  messagingSenderId:"906668222910",appId:"1:906668222910:web:19d92b627f155bd2dbb1ef"};
const app=getApps().find(a=>a.name==='vols')||initializeApp(FB,'vols');
const db=getFirestore(app);

let allSchedules=[], airports={};

// Coordonnées ICAO
const COORDS={
  'GQNO':[18.098,15.948],'NKC':[18.098,15.948],
  'LFPG':[49.009,2.547],'CDG':[49.009,2.547],
  'LTFM':[41.262,28.727],'IST':[41.262,28.727],
  'DAAG':[36.691,3.215],'ALG':[36.691,3.215],
  'DTTA':[36.851,10.227],'TUN':[36.851,10.227],
  'GMMN':[33.368,-7.590],'CMN':[33.368,-7.590],
  'GOBD':[14.739,-17.490],'DSS':[14.739,-17.490],
  'GCLP':[27.931,-15.388],'LPA':[27.931,-15.388],
  'GBYD':[13.338,-16.652],'BJL':[13.338,-16.652],
  'GUCY':[9.577,-13.612],'CKY':[9.577,-13.612],
  'DIAP':[5.254,-3.926],'ABJ':[5.254,-3.926],
  'DNMM':[6.577,3.321],'LOS':[6.577,3.321],
};
const NKC=[18.098,15.948];

// ── Map Leaflet ──
const map=L.map('map',{zoomControl:true,scrollWheelZoom:false}).setView([25,5],3);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);
const nkcIcon=L.divIcon({className:'',html:'<div style="width:12px;height:12px;border-radius:50%;background:#D4AF37;border:2px solid #fff;box-shadow:0 0 8px rgba(212,175,55,0.6);"></div>',iconSize:[12,12],iconAnchor:[6,6]});
L.marker(NKC,{icon:nkcIcon}).addTo(map).bindTooltip('NKC — Nouakchott',{permanent:false});
let activeLine=null, activeMarker=null, pinnedIdx=null;

function showRoute(s){
  clearRoute();
  // Extraire les codes ICAO du routing (ex: "LFPG 1615 - 2130 GQNO")
  const codes=(s.routing||'').match(/[A-Z]{4}/g)||[];
  const pts=codes.map(c=>COORDS[c]).filter(Boolean);
  if(pts.length<2)return;
  const c1=pts[0], c2=pts[pts.length-1];
  // Arc courbe
  const arc=[];
  for(let t=0;t<=24;t++){
    const r=t/24;
    arc.push([c1[0]+(c2[0]-c1[0])*r + Math.sin(Math.PI*r)*3, c1[1]+(c2[1]-c1[1])*r]);
  }
  activeLine=L.polyline(arc,{color:'#D4AF37',weight:2,opacity:.9,dashArray:'6 4'}).addTo(map);
  const destCoord=codes[0]==='GQNO'||codes[0]==='NKC'?c2:c1;
  const destCode =codes[0]==='GQNO'||codes[0]==='NKC'?codes[codes.length-1]:codes[0];
  const dIcon=L.divIcon({className:'',html:'<div style="width:10px;height:10px;border-radius:50%;background:#60a5fa;border:2px solid #fff;box-shadow:0 0 6px rgba(96,165,250,.5);"></div>',iconSize:[10,10],iconAnchor:[5,5]});
  activeMarker=L.marker(destCoord,{icon:dIcon}).addTo(map);
  map.fitBounds(L.latLngBounds([c1,c2]).pad(.25),{animate:true,duration:.4});
  document.getElementById('mapHover').style.display='';
  document.getElementById('mhiVol').textContent=s.vol||'—';
  document.getElementById('mhiRoute').textContent=s.routing||'—';
  document.getElementById('mhiDate').textContent=fmtPeriod(s.dateFrom,s.dateTo);
}
function clearRoute(){
  if(activeLine){map.removeLayer(activeLine);activeLine=null;}
  if(activeMarker){map.removeLayer(activeMarker);activeMarker=null;}
  document.getElementById('mapHover').style.display='none';
  map.setView([25,5],3,{animate:true});
}

// ── Utils ──
const MOIS=['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
const JOURS_L=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
function fmtPeriod(from,to){
  const f=v=>{if(!v)return'';const[y,m,d]=v.split('-');return`${parseInt(d)}-${MOIS[parseInt(m)-1]}-${y}`;};
  return from&&to?`${f(from)} au ${f(to)}`:f(from)||f(to)||'—';
}
function fmtDays(d){
  if(!d)return'—';
  const a=[];
  for(let i=0;i<7;i++){if(d[i]==='J')a.push(JOURS_L[i]);}
  // Compatibilité ancien format (J1---J5--)
  if(!a.length){for(let i=0;i<7;i++){if(d[i]&&d[i]!=='-')a.push(JOURS_L[i]);}}
  return a.length?a.join(' '):d;
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── Init ──
async function init(){
  try{
    // Charger uniquement les horaires (schedules)
    const snap=await getDocs(collection(db,'schedules'));
    allSchedules=snap.docs.map(d=>({id:d.id,...d.data()}));

    const comp=new Set(allSchedules.map(s=>s.company).filter(Boolean));
    const dests=new Set();
    allSchedules.forEach(s=>{
      const codes=(s.routing||'').match(/[A-Z]{4}/g)||[];
      codes.filter(c=>c!=='GQNO').forEach(c=>dests.add(c));
    });
    document.getElementById('stTotal').textContent=allSchedules.length;
    document.getElementById('stDest').textContent=dests.size;
    document.getElementById('stComp').textContent=comp.size;
    document.getElementById('tcSched').textContent=allSchedules.length;
    render();
  }catch(e){
    document.getElementById('flightsBody').innerHTML=`<div class="state-c"><div class="ico">⚠️</div><h3>Erreur</h3><p>${esc(e.message)}</p></div>`;
  }
}

window.doSearch=function(){ render(); };
window.resetSearch=function(){
  document.getElementById('sVol').value='';
  pinnedIdx=null; clearRoute(); render();
};

function render(){
  const q=document.getElementById('sVol').value.trim().toUpperCase();
  let list=[...allSchedules];
  if(q)list=list.filter(s=>
    (s.vol||'').toUpperCase().includes(q)||
    (s.company||'').toUpperCase().includes(q)||
    (s.routing||'').toUpperCase().includes(q)
  );
  list.sort((a,b)=>(a.company||'').localeCompare(b.company||'')||(a.vol||'').localeCompare(b.vol||''));

  document.getElementById('tcSched').textContent=list.length;

  if(!list.length){
    document.getElementById('flightsBody').innerHTML='<div class="state-c"><div class="ico">🔍</div><h3>Aucun vol trouvé</h3><p>Essayez un autre critère.</p></div>';
    clearRoute(); return;
  }

  // Grouper par compagnie
  const groups={};
  list.forEach((s,i)=>{s._idx=i; const k=s.company||'—'; if(!groups[k])groups[k]=[]; groups[k].push(s);});

  document.getElementById('flightsBody').innerHTML=Object.entries(groups).map(([co,rows])=>`
    <div style="background:rgba(212,175,55,0.04);padding:7px 18px;font-size:10px;font-weight:700;color:#D4AF37;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,0.04);">✈ ${esc(co)}</div>
    ${rows.map((s)=>`
    <div class="frow ${pinnedIdx===s._idx?'active-row':''}"
      style="grid-template-columns:130px 160px 1fr 180px;animation-delay:${Math.min(s._idx*.02,.4)}s"
      onmouseenter="if(pinnedIdx===null)window._hov(${s._idx})"
      onmouseleave="if(pinnedIdx===null)window._unhov()"
      onclick="window._pin(${s._idx})">
      <div class="vol-num" style="font-size:15px;">${esc(s.vol||'—')}</div>
      <div style="font-size:12px;color:#818cf8;font-family:var(--mono);">${esc(fmtDays(s.days||''))}</div>
      <div style="font-family:var(--mono);font-size:12px;color:#60a5fa;">${esc(s.routing||'—')}</div>
      <div style="font-size:11px;color:#94a3b8;">${esc(fmtPeriod(s.dateFrom,s.dateTo))}</div>
    </div>`).join('')}
  `).join('');

  window._allList=list;
}

window._hov=function(i){const s=window._allList&&window._allList[i];if(s)showRoute(s);};
window._unhov=function(){clearRoute();};
window._pin=function(i){
  if(pinnedIdx===i){pinnedIdx=null;clearRoute();}
  else{pinnedIdx=i;const s=window._allList&&window._allList[i];if(s)showRoute(s);}
  render();
};

init();
</script>
</body>
</html>
