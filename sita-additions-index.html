<!-- ============================================
     MODIFICATIONS À APPORTER DANS index.html
     ============================================ -->

<!-- 1. Dans la section <div class="actions">, AJOUTER ce bouton après le bouton "Ajouter un vol" : -->

<button class="btn-sita" id="importSitaBtn">📨 Importer SITA</button>


<!-- ============================================
     2. AJOUTER CE MODAL COMPLET avant la balise </body>
     (après le modal existant #flightModal)
     ============================================ -->

<div class="modal" id="sitaModal">
    <div class="modal-content modal-content--sita">
        <h2>📨 Importer un message SITA</h2>
        <p class="sita-help">
            Collez un message <strong>MVT</strong> (Movement) ou <strong>LDM</strong> (Load Distribution) ci-dessous.<br>
            Les données seront extraites automatiquement.
        </p>

        <div class="form-group">
            <label for="sitaTextarea">Message SITA</label>
            <textarea 
                id="sitaTextarea" 
                rows="10" 
                placeholder="Exemple MVT :
MVT
L6-101/15.A.GQNO.GQPP
AD1200/1340 EA1500
PX156/2

Exemple LDM :
LDM
L6-101/15.D.319.GQNO-GQPP
-GQPP.156.0.M1F2/TL156/2"
            ></textarea>
        </div>

        <div class="sita-parse-actions">
            <button class="btn-primary" id="parseSitaBtn">🔍 Analyser le message</button>
            <button class="btn-secondary" id="cancelSitaBtn">Annuler</button>
        </div>

        <!-- Zone de résultats parsés -->
        <div id="sitaResults" style="display:none;">
            <h3 class="sita-results-title">Vols détectés</h3>
            <div id="sitaResultsTable"></div>
            <div class="sita-import-actions">
                <button class="btn-success" id="importAllSitaBtn">✅ Importer tout</button>
                <button class="btn-secondary" id="cancelSitaImportBtn">Annuler</button>
            </div>
        </div>
    </div>
</div>


<!-- ============================================
     3. AJOUTER cette ligne dans les <script> en bas du <body>
     (AVANT app.js, APRÈS firebase.js)
     ============================================ -->

<script type="module" src="sita-parser.js"></script>

     NOTE : Le script principal app.js doit aussi être modifié.
     Voir le fichier sita-additions-app.js pour les ajouts à faire dans app.js
